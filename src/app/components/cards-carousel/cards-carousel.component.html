<swiper-container
  slides-per-view="1"
  space-between="16"
  navigation="false"
  pagination="false"
  scrollbar="false"
>
  <ion-skeleton-text
    *ngIf="isLoading"
    class="skeleton-style"
    animated
  ></ion-skeleton-text>

  <swiper-slide class="slide-style" *ngFor="let card of cardsData">
    <ion-card class="carousel-card" (click)="presentCardActions(card)">
      <ion-card-header class="card-header">
        <ion-card-title class="card-title">
          {{ card.title }}
        </ion-card-title>
        <ion-badge class="card-badge" [style.backgroundColor]="getBrandColor(card.brand)">
          {{ card.brand.toUpperCase() }}
        </ion-badge>
      </ion-card-header>

      <ion-card-content>
        <div class="card-infos">
          <span class="card-number">
            **** **** **** {{ card.lastDigits }}
          </span>

          <div>
            <div class="usage-row" *ngIf="card.type === 'credit_card'">
              <span class="card-info-title">
                Uso: {{ formatCurrency(getUsage(card)) }}
              </span>
              <span class="card-info-title">
                Limite: {{ formatCurrency(card.cardLimit!) }}
              </span>
            </div>

            <div class="usage-bar" *ngIf="card.type === 'credit_card'">
              <div
                class="usage-fill"
                [style.width.%]="getUsagePercent(card)"
              ></div>
            </div>

            <div class="bottom-row">
              <span *ngIf="card.type === 'debit_card'">
                Cartão de Débito
              </span>
              <div
                class="expires-box"
                *ngIf="card.dueDate && card.type === 'credit_card'"
              >
                <ion-icon
                  class="expires-icon"
                  name="calendar-clear-outline"
                ></ion-icon>
                <span class="card-info-title">
                  Venc. dia {{ card.dueDate }}
                </span>
              </div>
            </div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </swiper-slide>

  <swiper-slide class="slide-style" *ngIf="!isLoading">
    <ion-card class="carousel-card add-new-card" (click)="onAddCard()">
      <ion-icon
        class="add-new-card-icon"
        name="add-circle-outline"
      ></ion-icon>
      <span class="add-new-card-label">
        Adicionar Cartão
      </span>
    </ion-card>
  </swiper-slide>
</swiper-container>
