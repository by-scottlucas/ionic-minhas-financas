<div class="lista">

  <h3 class="titulo">Últimas movimentações</h3>

  <ion-list>
    <ion-item-sliding class="itemSlide" *ngFor="let movimentacao of movimentacoes; let i = index">
      <ion-item class="itemLista">
        <ion-label class="textoEvento">
          <p class="data">{{ movimentacao.data }}</p>
          <div class="movimentacao">
            <p class="title">{{ movimentacao.titulo }}</p>
            <p class="valor" [style.color]="movimentacao.tipo == 1 ? '#e74c3c' : '#2ecc71'">
              {{ movimentacao.tipo == 1 ? '-R$ ' : 'R$ ' }}{{ movimentacao.valor }}
            </p>
          </div>
        </ion-label>
      </ion-item>

      <ion-item-options>
        <ion-item-option class="botaoAcoes" (click)="editar(movimentacao)">
          <ion-icon name="create-outline" />
        </ion-item-option>
        <ion-item-option color="danger" class="botaoAcoes" (click)="excluir(i)">
          <ion-icon name="trash-outline" />
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>



</div>

<ion-modal [isOpen]="modal">
  <ng-template>
    <ion-content>
      <div class="container">
        <div class="header">
          <h1 class="titulo edicao">Editar</h1>

          <ion-input type="text" class="input" [(ngModel)]="titulo" />

          <ion-button class="input date" (click)="selecionarData()">dd/mm/yyyy</ion-button>

          <ion-modal [isOpen]="modalDate">
            <ng-template>
              <div class="modalData">
                <div class="calendario">

                  <ion-datetime id="datetime" presentation="date" [(ngModel)]="dataAtual" />

                  <div class="botoes">
                    <ion-button (click)="modalData(false)">Cancelar</ion-button>
                    <ion-button (click)="salvarData()">Salvar</ion-button>
                  </div>
                </div>


              </div>
            </ng-template>
          </ion-modal>

          <ion-button class="botao" (click)="salvarEdicao()">Editar</ion-button>
        </div>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
