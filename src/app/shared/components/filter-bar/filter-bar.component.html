<div class="filter-bar">
  <ion-row class="filter-bar__header">
    <lucide-angular
      [size]="20"
      class="filter-bar__header-icon"
      [name]="icons.date"
    ></lucide-angular>

    <h2 class="filter-bar__title">
      Movimentações
    </h2>
  </ion-row>

  <ion-row class="filter-bar__content">
    <div class="filter-bar__search">
      <lucide-angular
        [size]="18"
        class="filter-bar__search-icon"
        [name]="icons.search"
      ></lucide-angular>

      <input
        type="text"
        placeholder="Pesquisar por..."
        [(ngModel)]="searchTerm"
        (input)="onSearchChange($event)"
        class="filter-bar__search-input"
      />
    </div>

    <div class="filter-bar__button-container">
      <button
        class="filter-bar__button"
        *ngIf="enableAdvancedFilter"
        (click)="openAdvancedFilter()"
      >
        <lucide-angular
          [size]="28"
          class="filter-bar__button-icon"
          [name]="icons.advancedFilter"
        ></lucide-angular>

        <ion-badge
          color="danger"
          class="filter-bar__badge"
          *ngIf="appliedFiltersCount > 0"
        >
          {{ appliedFiltersCount }}
        </ion-badge>
      </button>
    </div>
  </ion-row>
</div>
